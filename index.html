<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engleski svaki dan</title>
<meta name="description" content="Besplatna aplikacija za učenje engleskog od A1 do C1: lekcije, izgovor, ponavljanje i rang lista.">
<meta name="theme-color" content="#2a51e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Engleski">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one-column phone app, max 560px, bottom tab bar; lessons take the full screen with a fixed action bar. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#f6f8fc; --ink:#15203a; --muted:#5b6784; --line:#d8dfeb;
  --accent:#2a51e0; --accent-ink:#ffffff; --accent-soft:#e3e9ff;
  --sun:#ffc928; --sun-ink:#3a2a00;
  --good:#16895a; --good-bg:#dff5ea; --bad:#c93a32; --bad-bg:#fde6e3;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px; --shadow:0 1px 0 rgba(21,32,58,.06), 0 6px 18px -10px rgba(21,32,58,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#172038; --surface2:#1c2642; --ink:#e7ecf7; --muted:#9ba7c4; --line:#2a3658;
  --accent:#7390ff; --accent-ink:#0b1022; --accent-soft:#232f57;
  --sun:#ffd451; --sun-ink:#2a1f00;
  --good:#3cc489; --good-bg:#11372a; --bad:#ff7066; --bad-bg:#3f1b1b;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#172038; --surface2:#1c2642; --ink:#e7ecf7; --muted:#9ba7c4; --line:#2a3658;
  --accent:#7390ff; --accent-ink:#0b1022; --accent-soft:#232f57;
  --sun:#ffd451; --sun-ink:#2a1f00;
  --good:#3cc489; --good-bg:#11372a; --bad:#ff7066; --bad-bg:#3f1b1b;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;flex:1;min-width:0}
.brand span{background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
.flame{color:#f08a1c}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:16px;padding-block:4px 20px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{background:none;border:0;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:700}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.today{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:64px;height:64px}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--line)} .ring .fgc{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{font-family:var(--font-display);font-weight:800;font-size:15px;fill:var(--ink)}
.today h2{font-size:19px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}

.next{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.next .eyebrow{color:inherit;opacity:.8}
.next h2{font-size:24px}
.next .btn{background:var(--sun);color:var(--sun-ink);align-self:flex-start;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.next::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:18px solid rgba(255,255,255,.13)}

.units{display:flex;flex-direction:column;gap:12px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:44px 1fr;gap:12px}
.unum{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px}
.unit.complete .unum{background:var(--good);color:#fff;border-color:transparent}
.unit h3{font-size:17px}
.unit .sr{font-size:14px;color:var(--muted)}
.lessons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lpill{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.lpill.done{background:var(--good-bg);border-color:transparent;color:var(--good)}
.lpill svg{width:14px;height:14px}

/* lesson */
.lhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.lhead .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.x{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted)}
.x svg{width:24px;height:24px;display:block}
.bar{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .35s}
.stage{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.stage .wrap{display:flex;flex-direction:column;gap:18px;padding-block:8px 20px}
.prompt{font-family:var(--font-display);font-size:22px;font-weight:700}
.big{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.say{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;color:var(--accent)}
.spk svg{width:22px;height:22px}
.spk.huge{padding:22px;border-radius:20px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.spk.huge svg{width:44px;height:44px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tagnew{align-self:flex-start;background:var(--sun);color:var(--sun-ink);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;letter-spacing:.06em}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.flash .tr{font-size:19px;color:var(--muted)}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-size:17px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.tok.used{visibility:hidden}
.field{width:100%;font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.bubbles{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:11px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.bub .who{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.bub .en{font-size:17px;font-weight:600}
.bub .srt{font-size:14px;color:var(--muted)}
.bub .mini{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--accent);font-size:13px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.bub .mini svg{width:16px;height:16px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tip p{margin:0}
.tip b{color:var(--accent)}
.tip table{border-collapse:collapse;font-size:15px}
.tip td{padding:4px 12px 4px 0;border-bottom:1px solid var(--line)}
.exl{display:flex;flex-direction:column;gap:8px}
.exl button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.exl .e{font-weight:700} .exl .s{color:var(--muted);font-size:14px}
.blank{font-family:var(--font-display);font-size:24px;font-weight:700}
.blank u{text-decoration:none;border-bottom:3px solid var(--accent);padding:0 18px}

.action{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.action .wrap{display:flex;flex-direction:column;gap:10px;padding-block:14px}
.action.ok{background:var(--good-bg);border-color:transparent}
.action.no{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:10px;align-items:flex-start}
.fb h3{font-size:20px}
.action.ok h3{color:var(--good)} .action.no h3{color:var(--bad)}
.fb .ans{font-weight:600;margin-top:2px}
.fb .ans small{display:block;color:var(--muted);font-weight:500}
.action.ok .btn{background:var(--good);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--good) 60%,#000)}
.action.no .btn{background:var(--bad);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000)}

.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:30px}
.done h1{font-size:30px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;gap:2px;align-items:center}
.stat b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* chat */
.scen{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scen button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.scen button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chatlog{display:flex;flex-direction:column;gap:10px}
.fix{align-self:flex-end;max-width:88%;background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.fix b{font-size:15px}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas button{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;text-align:left}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--bg);border-top:1px solid var(--line)}
.composer .wrap{display:flex;gap:8px;padding-block:10px}
.composer textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);height:46px}
main.chatpad{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.typing{color:var(--muted);font-style:italic}

/* stats */
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px;padding-top:6px}
.chart div{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div.today-b{background:var(--sun)}
.chart div.goal-hit{background:var(--good)}
.chartx{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
ol.howto{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:none;opacity:1}}
.stage .wrap>*{animation:pop .18s ease-out}

/* ---- v2 additions ---- */
.tabs .wrap{grid-template-columns:repeat(5,1fr);gap:2px}
.tab{font-size:11px}
.badge{right:calc(50% - 20px)}
.lvchip{background:var(--ink);color:var(--bg);border-color:var(--ink);letter-spacing:.04em}
.pageh{font-size:28px;margin-top:4px}
.stack{display:flex;flex-direction:column;gap:10px}
.stack h2{font-size:20px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
a.btn{display:inline-block;text-decoration:none;text-align:center;align-self:flex-start}
.next .btn.ghost.onacc{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.5);box-shadow:none}

/* plan */
.plan{display:flex;flex-direction:column;gap:12px}
.planhead{display:flex;gap:14px;align-items:center}
.planhead h2{font-size:20px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps button{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.steps .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.steps .dot svg{width:16px;height:16px}
.steps li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.steps li.done .st b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.steps li.cur button{border-color:var(--accent);background:var(--accent-soft)}
.steps li.cur .dot{border-color:var(--accent)}
.steps .st{flex:1;min-width:0;display:flex;flex-direction:column}
.steps .st span{font-size:13px;color:var(--muted)}
.steps .go{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px}
.chev{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .2s}
.chev.rot{transform:rotate(90deg)}

/* coach */
.coach{display:flex;flex-direction:column;gap:12px}
.tipc{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.tipc.first{padding-top:0;border-top:0}
.tipc b{font-family:var(--font-display);font-size:17px}
.tipc p{margin:0;color:var(--muted);font-size:14px}
.tipc .btn{align-self:flex-start}

/* levels */
.lvl{display:flex;flex-direction:column;gap:10px}
.lvlhead{display:grid;grid-template-columns:auto 1fr 70px auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.lvl.locked .lvlhead{opacity:.7}
.lvbadge{font-family:var(--font-display);font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 9px;font-size:15px;min-width:42px;text-align:center}
.lvbadge.off,.lvl.locked .lvbadge{background:var(--line);color:var(--muted)}
.lvt{display:flex;flex-direction:column;min-width:0}
.lvt span{font-size:13px;color:var(--muted)}
.lvbar,.sbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:block}
.lvbar i,.sbar i{display:block;height:100%;background:var(--good);border-radius:999px}
.sbar i.low{background:var(--bad)}
.unit.ulock{opacity:.55}
.unit.ulock .unum svg{width:18px;height:18px}
.lpill small{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.levtest{display:flex;flex-direction:column;gap:8px;border-color:var(--sun)}

/* skills */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.skills{grid-template-columns:repeat(2,1fr)}}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.skill .pct{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.lvrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center}
.lvrow .lvbadge{min-width:38px;padding:3px 6px;font-size:13px}
.lvname{font-size:14px;font-weight:600;min-width:84px}

/* microphone */
.micwrap{display:flex;align-items:center;gap:14px}
.mic{width:76px;height:76px;flex:none;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.mic svg{width:34px;height:34px}
.mic.on{animation:pulse 1.1s infinite}
.mic[disabled]{background:var(--line);box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.miclbl{font-weight:600;min-width:0}
.micres{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.score{font-family:var(--font-display);font-weight:800;font-size:26px;border-radius:12px;padding:6px 10px;font-variant-numeric:tabular-nums}
.score.good{background:var(--good-bg);color:var(--good)}
.score.mid{background:color-mix(in srgb,var(--sun) 30%,var(--surface));color:var(--sun-ink)}
.score.low{background:var(--bad-bg);color:var(--bad)}
.wd{border-radius:6px;transition:background .2s}
.wd.ok{color:var(--good)}
.wd.bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.speakline{font-size:28px}

/* feedback */
.your{color:var(--muted);font-size:14px}
.your s{color:var(--bad)}
.why{font-size:14px;background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--ink)}
.action .why{background:color-mix(in srgb,var(--surface) 70%,transparent)}
mark{background:var(--sun);color:var(--sun-ink);border-radius:4px;padding:0 3px}
.tagnew.warn{background:var(--bad);color:#fff}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;flex-direction:column;gap:3px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.mq{font-size:13px;color:var(--muted)}
.mc{font-size:15px}

/* forms */
.switch{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.switch input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.aform{display:flex;flex-direction:column;gap:10px}
.aform label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.aform .field{font-size:16px;padding:12px}
.amsg{margin:0;padding:8px 10px;border-radius:10px;background:var(--bad-bg);color:var(--ink);font-size:14px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.avatar svg{width:22px;height:22px}
.backup{font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}

/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lb li.me{border-color:var(--accent);background:var(--accent-soft)}
.rk{font-family:var(--font-display);font-weight:800;font-size:17px;text-align:center;border-radius:8px;padding:4px 0;font-variant-numeric:tabular-nums}
.rk.top1{background:var(--sun);color:var(--sun-ink)}
.rk.top2{background:var(--line)}
.rk.top3{background:color-mix(in srgb,#c8763a 35%,var(--surface))}
.nm{display:flex;flex-direction:column;min-width:0}
.nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm span{font-size:12px;color:var(--muted)}
.lb .xp{font-weight:800;font-variant-numeric:tabular-nums}

/* toast + sheet */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheetcard{background:var(--surface);color:var(--ink);border-radius:20px;padding:20px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sheetcard h2{font-size:22px}
.sheetcard p{margin:0;color:var(--muted)}

.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand em{font-style:normal}
@media (max-width:440px){.brand-rest{display:none}}
.exl button>svg{width:22px;height:22px;flex:none;color:var(--accent);align-self:center}
.lvrow.sk3{grid-template-columns:84px 1fr 44px}

.pron{font-size:16px;color:var(--muted)}
.pron b{color:var(--accent);letter-spacing:.02em}
.wline{display:flex;flex-wrap:wrap;gap:6px 8px}
.wbtn{font:inherit;background:none;border:0;border-bottom:2px dotted var(--line);padding:0 2px;color:var(--ink);cursor:pointer}
.wbtn:active{border-color:var(--accent);color:var(--accent)}
.abc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.abc button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.abc b{font-family:var(--font-display);font-size:24px}
.abc span{font-size:12px;color:var(--muted);text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{align-self:stretch}

/* ---------- AI character (avatar) ---------- */
.avw{--lvl:0;position:relative;width:min(210px,54vw);aspect-ratio:1;margin:0 auto}
.avw .av{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 14px rgba(21,32,58,.18))}
.avring{position:absolute;inset:-7px;border-radius:50%;border:4px solid var(--bad);opacity:0;transform:scale(1);transition:opacity .25s,transform .09s linear;pointer-events:none}
.avw.listening .avring{opacity:.85;transform:scale(calc(1 + var(--lvl) * .13))}
.avdots{position:absolute;right:2%;top:4%;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 10px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
.avdots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:avdot 1s infinite ease-in-out}
.avdots i:nth-child(2){animation-delay:.15s}.avdots i:nth-child(3){animation-delay:.3s}
.avw.thinking .avdots{opacity:1;transform:none}
@keyframes avdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.av .bd{transform-box:view-box;transform-origin:100px 200px;animation:av-breathe 4.2s ease-in-out infinite}
.av .hd{transform-box:view-box;transform-origin:100px 132px;animation:av-idle 7s ease-in-out infinite}
.av.talking .hd{animation:av-talkhead 1.6s ease-in-out infinite}
.av.listening .hd{animation:av-nod 2.6s ease-in-out infinite}
.av.thinking .hd{animation:av-think 2.4s ease-in-out infinite}
@keyframes av-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012,1.018)}}
@keyframes av-idle{0%,100%{transform:rotate(0)}25%{transform:rotate(1.6deg)}60%{transform:rotate(-1.4deg) translateY(.5px)}}
@keyframes av-talkhead{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-1.5deg) translateY(-1px)}70%{transform:rotate(1.5deg) translateY(.5px)}}
@keyframes av-nod{0%,100%{transform:rotate(2deg) translateY(0)}20%{transform:rotate(2deg) translateY(2.5px)}40%{transform:rotate(2deg) translateY(0)}}
@keyframes av-think{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-5.5deg) translateY(-1px)}}
.av .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);transition:transform .07s}
.av.blink .lid{transform:scaleY(1)}
.av .pp{transition:transform .35s ease}
.av.thinking .pp{transform:translate(2.6px,-3.4px)}
.av.listening .pp{transform:translate(0,.6px)}
.av .br{transform-box:fill-box;transform-origin:center;transition:transform .3s}
.av.happy .br{transform:translateY(-1.8px)}
.av.surprised .br{transform:translateY(-5px)}
.av.thinking .brL{transform:translateY(-3.5px) rotate(-6deg)}
.av.listening .br{transform:translateY(-1.5px)}
.av.sad .brL{transform:rotate(-13deg) translateY(1px)}
.av.sad .brR{transform:rotate(13deg) translateY(1px)}
.av .bl{opacity:.22;transition:opacity .4s}
.av.happy .bl{opacity:.6}
.av .m>*{opacity:0;transition:opacity .12s}
.av .m .ms{opacity:1}
.av .mo{transform-box:fill-box;transform-origin:center;transform:scaleY(.3)}
.av.happy .m .ms,.av.sad .m .ms,.av.surprised .m .ms,.av.talking .m .ms{opacity:0}
.av.happy .m .mb{opacity:1}
.av.sad .m .md{opacity:1}
.av.surprised .m .mx{opacity:1}
.av.talking .m .mb,.av.talking .m .md,.av.talking .m .mx{opacity:0}
.av.talking .m .mo{opacity:1;animation:av-talk .9s linear infinite}
@keyframes av-talk{0%{transform:scaleY(.25)}12%{transform:scaleY(1)}24%{transform:scaleY(.45)}38%{transform:scaleY(.95)}50%{transform:scaleY(.3)}62%{transform:scaleY(.8)}76%{transform:scaleY(.5)}88%{transform:scaleY(1)}100%{transform:scaleY(.25)}}

/* ---------- conversation screen ---------- */
.cvtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.cvtop .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.cvt{flex:1;min-width:0;display:flex;flex-direction:column}
.cvt b{font-family:var(--font-display);font-size:18px;line-height:1.2}
.cvt span{font-size:13px;color:var(--muted)}
#cvsr[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cvwrap{display:flex;flex-direction:column;gap:12px;padding-block:6px 36px}
.cvstage{padding-top:2px}
.cvbub{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);animation:pop .25s}
.cvbub::before{content:"";position:absolute;top:-9px;left:calc(50% - 9px);width:16px;height:16px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.cven{font-size:19px;font-weight:600;line-height:1.35;position:relative}
.cven.muted{font-weight:500;color:var(--muted)}
.cvsr{font-size:14px;color:var(--muted);margin-top:6px;position:relative}
.cvfb{display:flex;flex-direction:column;gap:8px}
.cvfb:empty{display:none}
.cvme{align-self:flex-end;max-width:88%;background:var(--accent-soft);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.cvme .who{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.cvme span:last-child{font-size:16px;font-weight:600}
.cvfix .mini{align-self:flex-start;background:none;border:0;padding:4px 0 0;color:var(--sun-ink);font-weight:700;font-size:13px;display:inline-flex;gap:4px;align-items:center;text-decoration:underline;text-underline-offset:3px}
.cvfix .mini svg{width:16px;height:16px}
.cvok{align-self:flex-end;display:inline-flex;align-items:center;gap:6px;background:var(--good-bg);color:var(--good);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.cvok svg{width:16px;height:16px}
.cvpron{align-self:flex-end;max-width:88%;border:1px solid var(--line);border-left:4px solid var(--accent)}
.cvaim{font-size:14px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.cvaim b{color:var(--ink)}
.cvdone{background:var(--good-bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;animation:pop .3s}
.cvdone b{color:var(--good);font-family:var(--font-display);font-size:18px}
.cvdone .btn{align-self:flex-start}
.cvhints:empty{display:none}
.cvctrl{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:4px}
.cvside{width:48px;height:48px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;padding:0}
.cvside svg{width:22px;height:22px}
.cvside.on{background:var(--accent-soft);border-color:var(--accent)}
.cvmic{width:84px;height:84px}
.cvstatus{text-align:center;font-size:14px;color:var(--muted);min-height:20px}
.cverr{color:var(--bad);display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.cverr .linkbtn{align-self:center}
.cvcomp{display:flex;gap:8px}
.cvcomp textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);height:48px}
.cvcomp .btn{padding:0 16px}
.cvcomp .btn svg{width:22px;height:22px;display:block}
.cvauto{justify-content:center;color:var(--muted)}
.cvdet summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px;padding:4px 0}
.cvlog{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.cvlegal{text-align:center;font-size:12px;margin:0}
.grecaptcha-badge{visibility:hidden}

/* scenario cards */
.scgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px;min-width:0;transition:transform .08s}
.scard:active{transform:scale(.98)}
.scface{width:52px;height:52px;flex:none}
.scface svg{width:100%;height:100%;display:block}
.scface .av *{animation:none!important}
.sctx{display:flex;flex-direction:column;min-width:0}
.sctx b{font-size:15px;line-height:1.2}
.sctx span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:360px){.scgrid{grid-template-columns:1fr}}

/* pronunciation mic: live level + checking state */
.mic.on{box-shadow:0 0 0 calc(var(--lvl,0) * 16px) color-mix(in srgb,var(--bad) 28%,transparent);animation:none}
.mic.on:not([style*="--lvl"]){animation:pulse 1.1s infinite}
.mic.busy{background:var(--accent);box-shadow:none;animation:micbusy 1s infinite ease-in-out}
@keyframes micbusy{0%,100%{opacity:1}50%{opacity:.55}}
</style>

/* Compact unit format: "en=sr|en=sr", dialog "A:en=sr|B:en=sr" */
function SP(s){ return s.split("|").map(x=>{ const i=x.indexOf("="); return [x.slice(0,i).trim(), x.slice(i+1).trim()]; }); }
function U(id,lvl,en,sr,w,p,d,g){
  return { id, lvl, en, sr, words:SP(w), phrases:SP(p),
    dialog:d.split("|").map(x=>{ const who=x[0]; const r=x.slice(2); const i=r.indexOf("="); return [who, r.slice(0,i).trim(), r.slice(i+1).trim()]; }),
    grammar:{ title:g.t, html:g.h, ex:SP(g.ex), quiz:g.q } };
}

const VOICE_F=/(Samantha|Karen|Moira|Tessa|Martha|Catherine|Nicky|Serena|Kate|Susan|Zira|Jenny|Aria|Ava|Allison|Emma|Sonia|Libby|Fiona|Victoria|Female|Google US English|Google UK English Female)/i;
const VOICE_M=/(Daniel|Aaron|Arthur|Gordon|Fred|Rishi|Alex|Tom|Oliver|Guy|David|Mark|Ryan|Thomas|Evan|Nathan|Reed|Male|Google UK English Male)/i;
const VOICE_ODD=/(Novelty|Bad News|Bells|Bubbles|Cellos|Jester|Organ|Trinoids|Whisper|Zarvox|Albert|Bahh|Boing|Superstar|Wobble|Junior|Ralph|Grandma|Grandpa|Kathy|Princess|Hysterical|Deranged|Good News|Pipe)/i;
function voiceFor(g){ if(!hasTTS) return null; const vs=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB|AU|IE|CA)/i.test(v.lang)&&!VOICE_ODD.test(v.name)); const re=g==="f"?VOICE_F:VOICE_M; return vs.find(v=>/en[-_]US/i.test(v.lang)&&re.test(v.name))||vs.find(v=>re.test(v.name))||null; }
function speakAs(c,text,slow,on){ on=on||{};
  if(!hasTTS){ on.end&&on.end(); return; }
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); const gv=voiceFor(c.g), v=gv||voice;
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
    u.rate=slow?0.7:Math.min(1.05,state.rate||0.9); u.pitch=gv?1:(c.g==="f"?1.18:0.82);
    let ended=false, started=false; const st=()=>{ if(!started){ started=true; on.start&&on.start(); } };
    const fin=()=>{ if(ended) return; ended=true; clearTimeout(tt); on.end&&on.end(); };
    const tt=setTimeout(fin,2500+text.length*(slow?120:85));
    u.onstart=st; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); setTimeout(()=>{ if(!ended) st(); },300);
  }catch(e){ on.end&&on.end(); } }

let CV=null;
function convSystem(s){ const c=CHARS[s.ch], lv=LV[curLevel()];
  return "Role-play for English speaking practice. You are "+c.name+", "+s.p+"\n"+
  "The learner is a Serbian speaker at CEFR level "+lv+". Talk like a real person: warm and natural, short turns (1-2 sentences, at most 25 words), with vocabulary and grammar a "+lv+" learner understands. Usually end with a question so the conversation continues. Stay in character and never say you are an AI.\n"+
  "Each learner turn is audio (their speech) or typed text. They may make mistakes or use Serbian words: understand them and continue naturally.\n"+
  "Reply ONLY with a JSON object with these keys:\n"+
  "\"heard\": exact transcription of what the learner really said, word for word, including mistakes (for typed text copy it; empty for your first line). If the audio has no clear speech, use \"\" and never invent what the learner said,\n"+
  "\"fix\": the corrected natural English version of the learner's sentence if it had grammar or vocabulary mistakes or Serbian words, otherwise \"\",\n"+
  "\"why\": if fix is not empty, a very short explanation in Serbian (Latin script) of the main mistake, otherwise \"\",\n"+
  "\"pron\": only for audio: if one word was clearly mispronounced, a short tip in Serbian (Latin script) that writes the right sound with Serbian letters, otherwise \"\",\n"+
  "\"reply\": your next line in English,\n"+
  "\"reply_sr\": Serbian (Latin script) translation of your reply,\n"+
  "\"mood\": one of \"happy\", \"neutral\", \"surprised\", \"sad\" that fits your reply,\n"+
  "\"hints\": an array of 2 short example answers in English the learner could say next,\n"+
  "\"goal_done\": true only when "+s.ge+", otherwise false."; }

function startConv(id){ unlockAudio(); const s=SCEN.find(x=>x.id===id); if(!s) return;

async function convAsk(input){ const c=CV; if(!c) return;
  c.busy=true; c.phase="thinking"; c.err=""; updConv();
  const contents=c.contents.slice();
  let parts;
  if(input==null) parts=[{text:"Start the conversation now with your first line, in character. heard, fix, why and pron must be empty."}];
  else if(input.text!=null) parts=[{text:"Learner (typed): "+input.text}];
  else parts=[{text:"Learner (audio). Transcribe it exactly in \"heard\"."},{inlineData:{mimeType:"audio/wav",data:input.b64}}];
  contents.push({role:"user",parts});
  let d;
  try{ d=await aiJSON(convSystem(c.s),contents); }
  catch(e){ if(CV!==c) return; c.busy=false; c.phase="idle"; c.err=aiErrMsg(e); c.retry=input; updConv(); return; }
  if(CV!==c) return;
  const reply=clean(d.reply); c.busy=false; c.retry=null;
  if(!reply){ c.phase="idle"; c.err="AI nije odgovorio. Pokušaj ponovo."; c.retry=input; updConv(); return; }
  if(input!=null){
    const heard=input.text!=null?input.text:clean(d.heard);
    if(!heard){ c.phase="idle"; c.err="Nisam razumeo šta si rekao. Probaj ponovo, malo glasnije i bliže telefonu."; updConv(); return; }
    const me={who:"me",text:heard,fix:clean(d.fix),why:clean(d.why),pron:input.text!=null?"":clean(d.pron)};
    if(me.fix&&norm(me.fix)===norm(me.text)){ me.fix=""; me.why=""; }
    c.lines.push(me); c.contents.push({role:"user",parts:[{text:"Learner said: "+heard}]});
    c.turns++; if(me.fix){ c.fixes++; state.log.unshift({q:"Razgovor · "+c.s.sr,a:me.text,c:me.fix,x:me.why,t:Date.now()}); state.log=state.log.slice(0,40); }
    addXP(me.fix?3:5); today().talk=true; save();
  } else c.contents.push({role:"user",parts:[{text:"(start)"}]});
  c.contents.push({role:"model",parts:[{text:JSON.stringify({reply,reply_sr:clean(d.reply_sr)})}]});
  if(c.contents.length>40) c.contents=c.contents.slice(0,2).concat(c.contents.slice(-30));
  c.lines.push({who:"ai",text:reply,sr:clean(d.reply_sr)});
  c.hints=Array.isArray(d.hints)?d.hints.slice(0,3).map(clean).filter(Boolean):[];

  if(c.av) c.av.mood(input!=null&&c.lines[c.lines.length-2]&&!c.lines[c.lines.length-2].fix?"happy":clean(d.mood));

function convSpeak(text,slow,thenListen){ const c=CV; if(!c) return; c.phase="speaking"; updConv();

    if(thenListen&&c.auto&&!c.typing&&!c.goal&&micEngine()!=="none") setTimeout(()=>{ if(CV===c&&c.phase==="idle"&&!c.busy) convListen(); },400); } }}); }
async function convListen(){ const c=CV; if(!c||c.busy) return;

    if(eng==="ai"){

/* ================= DATES ================= */
function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return dkey(new Date()); }
function yesterdayKey(){ const d=new Date(); d.setDate(d.getDate()-1); return dkey(d); }
function dayNum(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); }
function curStreak(){ return (state.lastDay===todayKey()||state.lastDay===yesterdayKey())?state.streak:0; }
function todayXP(){ return state.hist[todayKey()]||0; }
function weekId(){ const d=new Date(); const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7); return y+"-W"+String(w).padStart(2,"0"); }
function weekXP(){ const now=new Date(); const wd=(now.getDay()+6)%7; let s=0; for(let i=0;i<=wd;i++){ const d=new Date(now); d.setDate(now.getDate()-i); s+=state.hist[dkey(d)]||0; } return s; }
function today(){ const t=todayKey(); if(!state.today||state.today.date!==t) state.today={date:t}; return state.today; }
function addXP(n){
  const t=todayKey();
  if(state.lastDay!==t){ state.streak = state.lastDay===yesterdayKey()? state.streak+1 : 1; state.lastDay=t; }
  state.xp+=n; state.hist[t]=(state.hist[t]||0)+n;
  const keys=Object.keys(state.hist).sort(); while(keys.length>70) delete state.hist[keys.shift()];
  save();
}

/* ================= LEARNING MODEL ================= */
const INT=[0,1,2,4,7,15,30];
function itS(k){ return state.it[k]||(state.it[k]={b:0,d:dayNum(),e:0,c:0}); }
function markSeen(k){ if(!state.it[k]){ itS(k); save(); } }
function grade(k,ok){ const s=itS(k); if(ok){ s.b=Math.min(s.b+1,6); s.d=dayNum()+INT[s.b]; s.c=(s.c||0)+1; } else { s.b=1; s.d=dayNum(); s.e=(s.e||0)+1; s.c=0; } save(); }
function dueKeys(){ const n=dayNum(); return Object.keys(state.it).filter(k=>ITEMS[k]&&state.it[k].d<=n); }
function weakKeys(){ return Object.keys(state.it).filter(k=>{ const s=state.it[k]; return ITEMS[k]&&s.e>0&&s.c<3; }).sort((a,b)=>state.it[b].e-state.it[a].e); }
function rec(sk,ok){ if(!sk) return; state.sk[sk]=((state.sk[sk]||"")+(ok?"1":"0")).slice(-40); }
function skillAcc(sk){ const s=state.sk[sk]||""; if(s.length<6) return null; return Math.round(s.split("").filter(c=>c==="1").length/s.length*100); }
function prGrade(id,score){ const p=state.pr[id]||{b:0,n:0}; p.n++; p.l=score; p.b=Math.max(p.b,score); state.pr[id]=p;
  const ks=Object.keys(state.pr); if(ks.length>400) delete state.pr[ks[0]]; save(); }
function pronWeak(){ return Object.entries(state.pr).filter(([,p])=>p.b<PRON_PASS).map(([k])=>k); }
function plural(n,a,b,c){ const m10=n%10,m100=n%100; if(m10===1&&m100!==11) return a; if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return b; return c; }

const unitsOf = l => UNITS.filter(u=>u.lvl===l);
const lessonKey = (u,lk) => u.id+":"+lk;
const unitDone = u => LESSONS.every(([lk])=>state.done[lessonKey(u,lk)]);
function curLevel(){ return Math.min(state.lvl,4); }
function unitOpen(u){ const li=LV.indexOf(u.lvl); if(li<state.lvl) return true; if(li>state.lvl) return false; const a=unitsOf(u.lvl), i=a.indexOf(u); return i===0||unitDone(a[i-1]); }
function levelComplete(li){ return unitsOf(LV[li]).every(unitDone); }
function nextLesson(){ if(state.lvl>4) return null; for(const u of unitsOf(LV[state.lvl])){ if(!unitOpen(u)) break; for(const [lk,ln] of LESSONS) if(!state.done[lessonKey(u,lk)]) return {u,lk,ln}; } return null; }
